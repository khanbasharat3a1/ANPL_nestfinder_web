{% extends 'base.html' %}

{% block title %}Access Denied — {{ app_name }}{% endblock %}

{% block content %}
<div class="error-hero">
  <div class="error-code">403</div>
  <h1 class="error-title">Access Denied</h1>
  <p class="error-desc">
    You do not have the required permissions or role to view this page. If you believe this is in error, please contact your team lead.
  </p>
  <a href="{{ url_for('listings.explore') }}" class="btn btn-primary">
    Return to Explore
  </a>
</div>
{% endblock %}
