{% extends 'base.html' %}

{% block title %}Reset Password — {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-subtitle">Enter your registered email and we'll send a reset link</p>
    </div>

    <!-- Password Reset Form -->
    <form id="reset-form" onsubmit="handleReset(event)">
      <div class="form-group">
        <label for="reset-email" class="form-label">Email address</label>
        <input type="email" id="reset-email" class="form-control" placeholder="name@atomicnorth.com" required autocomplete="email">
      </div>

      <button type="submit" id="btn-submit-reset" class="btn btn-primary btn-block">
        Send Reset Link
      </button>
    </form>

    <div style="text-align:center;margin-top:1.5rem;font-size:0.875rem;">
      <a href="{{ url_for('auth.login') }}">Back to Sign In</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  function handleReset(event) {
    event.preventDefault();
    const email = document.getElementById('reset-email').value;
    const btn = document.getElementById('btn-submit-reset');

    btn.disabled = true;
    btn.textContent = 'Sending...';

    if (window.NestFinderAuth?.requestPasswordReset) {
      window.NestFinderAuth.requestPasswordReset(email)
        .finally(() => {
          btn.disabled = false;
          btn.textContent = 'Send Reset Link';
        });
    } else {
      btn.disabled = false;
      btn.textContent = 'Send Reset Link';
      window.NestFinder.showToast('Module loading, please retry...', 'info');
    }
  }
</script>
{% endblock %}
