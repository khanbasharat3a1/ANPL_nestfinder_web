<div id="toast-container" class="flash-container" aria-live="polite">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash-message flash-{{ category if category != 'message' else 'info' }}">
          <span>{{ message }}</span>
          <button type="button" onclick="this.parentElement.remove()" style="background:none;border:none;cursor:pointer;font-size:1.2rem;line-height:1;color:inherit;" aria-label="Close">&times;</button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}
</div>
