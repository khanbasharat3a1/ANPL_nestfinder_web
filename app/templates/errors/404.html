{% extends 'base.html' %}

{% block title %}Page Not Found — {{ app_name }}{% endblock %}

{% block content %}
<div class="error-hero">
  <div class="error-code">404</div>
  <h1 class="error-title">Page Not Found</h1>
  <p class="error-desc">
    The accommodation listing or page you are looking for does not exist or may have been unlisted.
  </p>
  <a href="{{ url_for('listings.explore') }}" class="btn btn-primary">
    Return to Explore
  </a>
</div>
{% endblock %}
